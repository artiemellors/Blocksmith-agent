# Blocksmith Training Block Configuration Example
# This is a complete example configuration for Arthur Mellors

athlete:
  name: "Arthur Mellors"
  age: 41

physiological_parameters:
  hr_max: 188
  threshold_t1_pace: "4:37"  # mm:ss per km (T1 threshold)
  threshold_t2_pace: "4:17"  # mm:ss per km (T2 threshold)
  # vo2_max: 55  # Optional: VO2 max in ml/kg/min

injury_information:
  # List any active injuries that need to be considered
  active_injuries: []
  # Example: ["quad pain", "shoulder soreness"]

  # Pain thresholds (0-10 scale)
  pain_threshold_during: 2      # Max acceptable pain during session
  pain_threshold_next_day: 3    # Max acceptable pain the next day

  # If soreness persists beyond this many hours, reduce next run volume
  soreness_cutoff_hours: 36

  # Percentage to reduce volume if soreness exceeds cutoff
  volume_reduction_percent: 25

block_objectives:
  # Primary goal: Specify your training phase (one of: BASE, BUILD, PEAK, TAPER, TRANSITION)
  # - BASE: Aerobic capacity building (10% weekly progression)
  # - BUILD: Threshold development (5% weekly progression)
  # - PEAK: Race-specific training (2.5% weekly progression)
  # - TAPER: Pre-race freshness (-20% weekly volume)
  # - TRANSITION: Active recovery (0% progression)
  primary_goal: "BUILD"

  # Starting weekly running mileage in kilometers
  running_mileage_week1: 40

  # Optional: Manual override for weekly progression percentage
  # If not specified, uses phase-appropriate default (see above)
  # weekly_progression_override: 10

  # Number of progressive build weeks before deload
  block_duration_weeks: 4

  # Include a deload week at the end?
  deload_week: true

  # Optional: Target race date (YYYY-MM-DD format)
  # target_race_date: "2025-03-15"

  # Optional: HYROX race category (automatically loads official weights)
  # Options: "Men", "Women", "Pro Men", "Pro Women", "Doubles"
  # race_type: "Men"

  # Specific areas to focus on during this block
  specific_focus_areas:
    - "threshold running"
    - "sled work"
    - "wall balls"
    - "VO2 max development"

# Optional: Path to your previous training block markdown file
# This helps maintain continuity and build progressively
previous_training_block_file: null
# Example: "blocks/previous_block_2024_11.md"

# Optional: Any additional context or special requests
additional_context: null
# Example: "Prioritize shoulder health; avoid heavy overhead work in Week 1"
